ingestion:
  max_file_size_mb: 50
  max_urls_per_run: 500
  http_timeout_seconds: 10
  retry_max_attempts: 3
  rate_limit_delay_seconds: 1
  cache_ttl_hours: 24

query:
  default_page_size: 20
  max_page_size: 200

scoring:
  batch_size: 500

export:
  batch_size: 10000
  output_dir: exports

database:
  path: data/leadhunter.db
  wal_mode: true

logging:
  level: INFO
  file_path: logs/leadhunter.log
  max_bytes: 10485760  # 10 MB
  backup_count: 10

actor: cli

proxy:
  server: ""
  username: ""
  password: ""

serpapi:
  api_key: ""
