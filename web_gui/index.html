<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadHunter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --modal-bg: #ffffff;
            --header-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --apple-blue: #007aff;
            --apple-blue-hover: #0062cc;
            --apple-green: #34c759;
            --apple-red: #ff3b30;
            --radius-apple: 14px;
            --shadow-apple: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.95);
                --modal-bg: #1c1c1e;
                --header-bg: #1c1c1e;
                --card-border: rgba(255, 255, 255, 0.12);
                --text-main: #f5f5f7;
                --text-sub: #a1a1a6;
                --apple-blue: #0a84ff;
                --apple-blue-hover: #409cff;
                --shadow-apple: 0 4px 20px rgba(0, 0, 0, 0.4);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }

        .dot-close { background: #ff5f56; }
        .dot-min { background: #ffbd2e; }
        .dot-max { background: #27c93f; }

        .app-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
        }

        .license-pill {
            font-size: 11px;
            font-weight: 500;
            background: rgba(52, 199, 89, 0.12);
            color: var(--apple-green);
            padding: 4px 10px;
            border-radius: 12px;
        }

        main {
            flex: 1;
            padding: 20px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .apple-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-apple);
            padding: 18px 20px;
            box-shadow: var(--shadow-apple);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .apple-input {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 9px 14px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
        }
        @media (prefers-color-scheme: dark) {
            .apple-input { background: rgba(255, 255, 255, 0.06); }
        }

        .apple-input:focus {
            border-color: var(--apple-blue);
        }

        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }

        .check-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--apple-blue);
            cursor: pointer;
        }

        .apple-btn {
            background: var(--apple-blue);
            color: white; border: none; border-radius: 10px;
            padding: 9px 16px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: all 0.15s ease;
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .apple-btn:hover { background: var(--apple-blue-hover); }

        .apple-btn-secondary {
            background: rgba(0, 0, 0, 0.05); color: var(--text-main);
            border: 1px solid var(--card-border);
        }
        @media (prefers-color-scheme: dark) {
            .apple-btn-secondary { background: rgba(255, 255, 255, 0.08); }
        }

        .apple-btn-danger {
            background: var(--apple-red); color: white; border: none;
        }

        /* Terminal Console Box (Màu chữ hài hòa, dịu mắt chuẩn macOS) */
        .terminal-box {
            background: #1c1c1e;
            color: #e4e4e7;
            font-family: "Fira Code", "SF Mono", monospace;
            font-size: 12px;
            border-radius: 12px;
            padding: 12px 16px;
            height: 380px;
            overflow-y: auto;
            line-height: 1.5;
            white-space: normal;
            word-break: break-all;
            display: block;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .terminal-line {
            display: block;
            text-align: left;
            margin: 0 0 4px 0;
            padding: 0;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .terminal-line.info { color: #e4e4e7; }
        .terminal-line.success { color: #4ade80; }
        .terminal-line.error { color: #f87171; }
        .terminal-line.warn { color: #c084fc; }

        /* Progress Bar */
        #progress-container { display: none; margin-top: 14px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--text-main); margin-bottom: 6px; }
        .progress-bg { height: 6px; background: rgba(0, 0, 0, 0.08); border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--apple-blue); transition: width 0.3s ease; }

        /* Modals */
        .apple-modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .apple-dialog {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 24px 28px;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        }

        .apple-dialog-lg {
            width: 92vw;
            max-width: 1150px;
            height: 88vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .table-wrap {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-apple);
            overflow-y: auto;
            flex: 1;
            position: relative;
            margin: 14px 0;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: var(--header-bg) !important;
            color: var(--text-sub);
            font-weight: 600;
            padding: 14px 18px;
            border-bottom: 2px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        td {
            padding: 12px 18px;
            border-bottom: 1px solid var(--card-border);
        }

        

        /* Premium Badges & Elements */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-new {
            background: rgba(52, 199, 89, 0.12);
            color: var(--apple-green);
        }
        .badge-contacted {
            background: rgba(0, 122, 255, 0.12);
            color: var(--apple-blue);
        }
        .badge-maps {
            background: rgba(255, 149, 0, 0.12);
            color: #ff9500;
        }
        .badge-excel {
            background: rgba(88, 86, 214, 0.12);
            color: #5856d6;
        }
        
        .web-link-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: rgba(0, 122, 255, 0.08);
            color: var(--apple-blue);
            transition: all 0.15s ease;
            vertical-align: middle;
            margin-left: 6px;
        }
        .web-link-icon:hover {
            background: var(--apple-blue);
            color: white;
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 204, 0, 0.12);
            color: #d1a100;
        }
        
        /* Modern pagination bar */
        .pagination-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--card-border);
        }
        #page-info {
            display: none;
        }
        /* Premium Toast Notifications */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--modal-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            min-width: 320px;
            max-width: 450px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            pointer-events: auto;
        }
        .toast.show {
            transform: translateX(0);
        }
        .toast-success i { color: var(--apple-green); }
        .toast-error i { color: var(--apple-red); }
        .toast-info i { color: var(--apple-blue); }
        .toast-warn i { color: #ff9500; }
        /* Modern icon style */
        .btn-icon-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Native File Picker (Hidden) -->
    <input type="file" id="native-file-picker" accept=".xlsx" style="display: none;" onchange="onNativeFileSelected(event)">

    <!-- Auth Modal -->
    <div id="auth-modal" class="apple-modal-bg" style="display: none;">
        <div class="apple-dialog" style="text-align: center;">
            <div style="font-size: 36px; margin-bottom: 10px;">🔑</div>
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">Kích Hoạt Bản Quyền</div>
            <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 14px;">Nhập Mã Kích Hoạt để sử dụng phần mềm.</div>
            <input type="password" id="license-input" class="apple-input" style="width: 100%; margin-bottom: 14px; text-align: center;" placeholder="Mã kích hoạt..." autofocus>
            <button class="apple-btn" style="width: 100%; justify-content: center;" onclick="submitAuth()">Kích Hoạt</button>
            <div id="auth-error" style="color: var(--apple-red); font-size: 12px; margin-top: 10px; display: none;">❌ Mã bản quyền sai!</div>
        </div>
    </div>

    <!-- CSDL Modal -->
    <div id="db-modal" class="apple-modal-bg" style="display: none;">
        <div class="apple-dialog apple-dialog-lg">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div style="font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 6px;">
                        <i data-lucide="database" style="color: var(--apple-blue); width: 20px; height: 20px;"></i>
                        Cơ Sở Dữ Liệu
                    </div>
                    <div style="font-size: 12px; color: var(--text-sub); margin-top: 2px;">Tổng: <b id="stat-total" style="color: var(--apple-blue);">0</b> lead | Từ Excel: <b id="stat-excel">0</b> lead</div>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <div style="display: flex; align-items: center; background: rgba(0,0,0,0.04); padding: 2px 4px; border-radius: 8px; gap: 4px; border: 1px solid var(--card-border);" title="Nhập số lượng số mới nhất muốn xuất Excel">
                        <input type="number" id="db-export-limit" class="apple-input" style="width: 55px; height: 28px; padding: 2px 4px; font-size: 12px; text-align: center; border: none; background: transparent;" value="80" placeholder="Số lượng">
                        <button class="apple-btn apple-btn-secondary btn-icon-wrapper" style="height: 28px; padding: 0 10px; font-size: 12px;" onclick="triggerSaveAsExport()">
                            <i data-lucide="download" style="width: 14px; height: 14px;"></i>Xuất Excel
                        </button>
                        <button class="apple-btn apple-btn-secondary btn-icon-wrapper" style="height: 28px; padding: 0 10px; font-size: 12px; background: rgba(43,87,154,0.12); color: #2b579a; border-color: rgba(43,87,154,0.3);" onclick="triggerExportWord()" title="Xuất file Word (.docx) dạng Thẻ Lưới A4">
                            <i data-lucide="file-text" style="width: 14px; height: 14px;"></i>Xuất Word
                        </button>
                    </div>
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" onclick="triggerClickSelectNap()">
                        <i data-lucide="upload" style="width: 14px; height: 14px;"></i>Nạp Excel
                    </button>
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" onclick="triggerAction('quet')">
                        <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i>Quét trùng
                    </button>
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" style="color: var(--apple-red);" onclick="triggerAction('huy')">
                        <i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i>Hoàn tác
                    </button>
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" style="color: var(--apple-red);" onclick="triggerAction('reset')">
                        <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>Reset
                    </button>
                    <button class="apple-btn btn-icon-wrapper" onclick="closeDbModal()" style="background: rgba(120, 120, 128, 0.2); color: var(--text-main);">
                        <i data-lucide="x" style="width: 14px; height: 14px;"></i>Đóng
                    </button>
                </div>
            </div>

            <!-- Search box -->
            <div style="margin-top: 14px; display: flex; gap: 10px; align-items: center; background: rgba(0,0,0,0.03); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--card-border);">
                <i data-lucide="search" style="width: 16px; height: 16px; color: var(--text-sub);"></i>
                <input type="text" id="db-search-input" style="flex: 1; border: none; background: transparent; font-size: 13px; outline: none; color: var(--text-main);" placeholder="Tìm kiếm nhanh trong CSDL theo tên, số điện thoại, địa chỉ hoặc nguồn..." oninput="onDbSearch()">
            </div>

            <!-- Table -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">STT</th>
                            <th>Tên Cửa Hàng</th>
                            <th style="width: 120px;">SĐT</th>
                            <th>Địa Chỉ</th>
                            <th style="width: 90px; text-align: center;">Nguồn</th>
                        </tr>
                    </thead>
                    <tbody id="lead-table-body">
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--text-sub); padding: 24px;">Đang tải CSDL...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination Bar -->
            <div class="pagination-bar">
                <div id="page-info">Hiển thị 0 lead</div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" id="btn-prev" onclick="changePage(-1)">
                        <i data-lucide="chevron-left" style="width: 14px; height: 14px;"></i>Trước
                    </button>
                    <span id="page-num" style="font-weight: 600;">1 / 1</span>
                    <button class="apple-btn apple-btn-secondary btn-icon-wrapper" id="btn-next" onclick="changePage(1)">
                        Sau<i data-lucide="chevron-right" style="width: 14px; height: 14px;"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="window-controls">
            <div class="dot dot-close"></div>
            <div class="dot dot-min"></div>
            <div class="dot dot-max"></div>
        </div>
        <div class="app-title">Tìm trên Google Maps</div>
        <div class="license-pill" style="background:rgba(52,199,89,0.15);color:var(--apple-green);">Bản Miễn Phí</div>
    </header>

    <!-- Main Container -->
    <main>
        <!-- Search Card -->
        <div class="apple-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title">TÌM KIẾM LEAD</div>
                <button class="apple-btn apple-btn-secondary" onclick="openDbModal()">
                    🗄️ CSDL (<span id="main-db-count">0</span>)
                </button>
            </div>
            
            <div class="search-row">
                <input type="text" id="kw-input" class="apple-input" style="flex: 1; min-width: 220px;" placeholder="Từ khóa (nha khoa, xây dựng...)" autofocus>
                <input type="number" id="target-input" class="apple-input" style="width: 75px; text-align: center;" value="80" placeholder="80" title="Mục tiêu số lượng lead (Target)">
                
                <label class="check-label" title="Tích chọn để lấy thêm cả số Viettel (Mặc định sẽ chặn số Viettel)">
                    <input type="checkbox" id="viettel-check"> + Viettel
                </label>
                <label class="check-label" title="Tích chọn để lấy thêm cả địa điểm có Website (Mặc định sẽ chặn địa điểm đã có website)">
                    <input type="checkbox" id="web-check"> + Có Web
                </label>

                <button class="apple-btn" id="btn-scrape" onclick="startScrape()">▶ Bắt Đầu</button>
                <button class="apple-btn apple-btn-danger" id="btn-stop" onclick="stopScrape()" style="display: none;">🛑 Dừng (Ctrl+C)</button>
            </div>

            <!-- Progress Bar -->
            <div id="progress-container">
                <div class="progress-info">
                    <span id="progress-status">🚀 Đang cào...</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Terminal Console Box -->
        <div class="apple-card" style="padding: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="section-title">💻 TIẾN TRÌNH REAL-TIME</div>
                <button class="apple-btn apple-btn-secondary" style="font-size: 11px; padding: 4px 8px;" onclick="clearLogs()">🧹 Xóa Log</button>
            </div>
            <div class="terminal-box" id="terminal-log"><div class="terminal-line info"></div></div>
        </div>
    </main>

    <script>
        let allLeads = [];
        let currentPage = 1;
        const pageSize = 20;
        let scrapeInterval = null;

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey && e.key.toLowerCase() === 'c') || e.key === 'Escape') {
                stopScrape();
            }
        });

        async function submitAuth() {
            const key = document.getElementById('license-input').value.trim();
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key})
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('auth-modal').style.display = 'none';
                loadLeads();
            } else {
                document.getElementById('auth-error').style.display = 'block';
            }
        }

        let filteredLeads = [];

        function onDbSearch() {
            const query = document.getElementById('db-search-input').value.trim().toLowerCase();
            if (!query) {
                filteredLeads = [...allLeads];
            } else {
                filteredLeads = allLeads.filter(l => 
                    (l.company_name && l.company_name.toLowerCase().includes(query)) ||
                    (l.phone && l.phone.toLowerCase().includes(query)) ||
                    (l.address && l.address.toLowerCase().includes(query)) ||
                    (l.source && l.source.toLowerCase().includes(query))
                );
            }
            currentPage = 1;
            renderTable();
        }

        async function loadLeads() {
            try {
                // Check activation status first
                const authRes = await fetch('/api/check-auth');
                const authData = await authRes.json();
                if (authData.activated) {
                    document.getElementById('auth-modal').style.display = 'none';
                }

                const res = await fetch('/api/leads');
                const data = await res.json();
                const total = data.total || 0;
                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-excel').innerText = data.excel_count || 0;
                document.getElementById('main-db-count').innerText = total;
                
                allLeads = data.leads || [];
                onDbSearch(); // Load data and apply initial search (empty)
            } catch (err) {
                console.error(err);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('lead-table-body');
            const total = filteredLeads.length;
            
            if (total === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-sub); padding: 24px;">Không tìm thấy dữ liệu phù hợp!</td></tr>';
                document.getElementById('page-info').innerText = 'Hiển thị 0 lead';
                document.getElementById('page-num').innerText = '1 / 1';
                document.getElementById('btn-prev').disabled = true;
                document.getElementById('btn-next').disabled = true;
                return;
            }

            const totalPages = Math.ceil(total / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, total);
            const pageLeads = filteredLeads.slice(startIdx, endIdx);

            tbody.innerHTML = pageLeads.map((l, idx) => {
                const sourceClass = l.source && l.source.toLowerCase() === 'excel' ? 'badge-excel' : 'badge-maps';
                
                let webHtml = escapeHtml(l.company_name);
                if (l.website && l.website.trim()) {
                    let cleanWeb = l.website.trim();
                    if (!cleanWeb.startsWith('http://') && !cleanWeb.startsWith('https://')) {
                        cleanWeb = 'http://' + cleanWeb;
                    }
                    webHtml += ` <a href="${cleanWeb}" target="_blank" class="web-link-icon" title="Xem Website: ${escapeHtml(l.website)}"><i data-lucide="globe" style="width: 11px; height: 11px;"></i></a>`;
                }

                return `
                    <tr>
                        <td style="color: var(--text-sub);">${startIdx + idx + 1}</td>
                        <td style="font-weight: 500;">${webHtml}</td>
                        <td style="font-weight: 600; color: var(--apple-blue);">${l.phone}</td>
                        <td style="color: var(--text-sub); font-size: 12px;">${l.address || ''}</td>
                        <td style="text-align: center;"><span class="badge ${sourceClass}">${l.source}</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('page-info').innerText = `Hiển thị ${startIdx + 1} - ${endIdx} trong số ${total}`;
            document.getElementById('page-num').innerText = `${currentPage} / ${totalPages}`;
            document.getElementById('btn-prev').disabled = (currentPage === 1);
            document.getElementById('btn-next').disabled = (currentPage === totalPages);
            
            // Re-create Lucide icons for dynamically added table rows
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }

        function changePage(delta) {
            currentPage += delta;
            renderTable();
        }

        function openDbModal() {
            loadLeads();
            document.getElementById('db-search-input').value = ''; // Reset search field on open
            document.getElementById('db-modal').style.display = 'flex';
            setTimeout(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, 100);
        }

        function closeDbModal() {
            document.getElementById('db-modal').style.display = 'none';
        }

        function clearLogs() {
            document.getElementById('terminal-log').innerHTML = '<div class="terminal-line info"></div>';
        }

        function triggerClickSelectNap() {
            document.getElementById('native-file-picker').click();
        }

        function onNativeFileSelected(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const arrayBuffer = e.target.result;
                const base64String = btoa(
                    new Uint8Array(arrayBuffer).reduce((data, byte) => data + String.fromCharCode(byte), '')
                );

                const res = await fetch('/api/upload-nap', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        file_name: file.name,
                        file_data: base64String
                    })
                });
                const data = await res.json();
                showToast(data.message || `Đã nạp thành công file: ${file.name}`, data.success ? 'success' : 'error');
                loadLeads();
            };
            reader.readAsArrayBuffer(file);
        }

        let isExportingExcel = false;
        function triggerSaveAsExport() {
            if (isExportingExcel) return;
            isExportingExcel = true;

            let limitInput = document.getElementById('db-export-limit');
            let limit_str = limitInput ? limitInput.value.trim() : '';
            let limit = limit_str === '' ? 0 : (parseInt(limit_str) || 0);
            
            let msg = limit > 0 ? `🚀 Đang đóng gói và tải về ${limit} lead mới nhất...` : `🚀 Đang đóng gói và tải về TOÀN BỘ lead trong CSDL...`;
            showToast(msg, 'info');
            window.location.href = `/api/download?limit=${limit}`;

            setTimeout(() => { isExportingExcel = false; }, 3000);
        }

        let isExportingWord = false;
        function triggerExportWord() {
            if (isExportingWord) return;
            isExportingWord = true;

            let limitInput = document.getElementById('db-export-limit');
            let limit_str = limitInput ? limitInput.value.trim() : '';
            let limit = limit_str === '' ? 0 : (parseInt(limit_str) || 0);

            let msg = limit > 0 ? `🚀 Đang xuất file Word (.docx) cho ${limit} lead mới nhất...` : `🚀 Đang xuất file Word (.docx) cho TOÀN BỘ lead trong CSDL...`;
            showToast(msg, 'info');
            window.location.href = `/api/download_word?limit=${limit}`;

            setTimeout(() => { isExportingWord = false; }, 3000);
        }

        let scrapeTimeout = null;
        const renderedLogs = new Set();

        document.addEventListener('DOMContentLoaded', () => {
            const handleEnterKey = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    startScrape();
                }
            };
            const kwInput = document.getElementById('kw-input');
            const targetInput = document.getElementById('target-input');
            if (kwInput) kwInput.addEventListener('keydown', handleEnterKey);
            if (targetInput) targetInput.addEventListener('keydown', handleEnterKey);
        });

        async function startScrape() {
            const kw = document.getElementById('kw-input').value.trim();
            const target = parseInt(document.getElementById('target-input').value) || 80;

            const allow_viettel = document.getElementById('viettel-check').checked;
            const allow_vina = false;
            const allow_mobi = false;
            const allow_web = document.getElementById('web-check').checked;

            if (!kw) {
                showToast('Vui lòng nhập từ khóa tìm kiếm!', 'warn');
                return;
            }

            const btnScrape = document.getElementById('btn-scrape');
            const btnStop = document.getElementById('btn-stop');
            btnScrape.style.display = 'none';
            btnStop.style.display = 'inline-flex';

            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-bar').style.width = '10%';
            document.getElementById('progress-percent').innerText = '10%';
            document.getElementById('progress-status').innerText = `🚀 Đang cào '${kw}'...`;

            // Clear logs on a new scrape run
            clearLogs();
            renderedLogs.clear();

            const res = await fetch('/api/scrape', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({kw, target, allow_viettel, allow_vina, allow_mobi, allow_web})
            });
            const data = await res.json();

            if (!data.success) {
                showToast(data.message || 'Lỗi khởi chạy cào!', 'error');
                btnScrape.style.display = 'inline-flex';
                btnStop.style.display = 'none';
                document.getElementById('progress-container').style.display = 'none';
                return;
            }

            if (scrapeTimeout) clearTimeout(scrapeTimeout);

            async function pollStatus() {
                try {
                    const stRes = await fetch('/api/status');
                    const st = await stRes.json();

                    document.getElementById('progress-container').style.display = 'block';
                    document.getElementById('progress-bar').style.width = (st.progress || 0) + '%';
                    document.getElementById('progress-percent').innerText = (st.progress || 0) + '%';
                    document.getElementById('progress-status').innerText = st.status || 'Đang cào dữ liệu...';

                    if (st.logs && st.logs.length > 0) {
                        const term = document.getElementById('terminal-log');
                        let newLogsAdded = false;

                        // Only append logs that are not already rendered to prevent duplicates and data loss
                        st.logs.forEach(line => {
                            if (!renderedLogs.has(line)) {
                                renderedLogs.add(line);
                                let cls = 'info';
                                if (line.includes('✓') || line.includes('Hoàn thành') || line.includes('thành công')) cls = 'success';
                                else if (line.includes('❌') || line.includes('Lỗi') || line.includes('Error') || line.includes('🛑')) cls = 'error';
                                else if (line.includes('🔄') || line.includes('Quét')) cls = 'warn';

                                const div = document.createElement('div');
                                div.className = `terminal-line ${cls}`;
                                div.innerHTML = escapeHtml(line);
                                term.appendChild(div);
                                newLogsAdded = true;
                            }
                        });

                        if (newLogsAdded) {
                            term.scrollTop = term.scrollHeight;
                        }
                    }

                    loadLeads();

                    if (st.running) {
                        // Poll again only after the current request completes, preventing out-of-order jumping
                        scrapeTimeout = setTimeout(pollStatus, 500);
                    } else {
                        btnScrape.style.display = 'inline-flex';
                        btnStop.style.display = 'none';
                        scrapeTimeout = null;
                    }
                } catch (e) {
                    console.error(e);
                    // Retry after 1 second on connection error
                    scrapeTimeout = setTimeout(pollStatus, 1000);
                }
            }

            scrapeTimeout = setTimeout(pollStatus, 500);
        }

        async function stopScrape() {
            try {
                const res = await fetch('/api/stop-scrape', { method: 'POST' });
                const data = await res.json();
                
                if (scrapeTimeout) {
                    clearTimeout(scrapeTimeout);
                    scrapeTimeout = null;
                }

                document.getElementById('btn-scrape').style.display = 'inline-flex';
                document.getElementById('btn-stop').style.display = 'none';
                document.getElementById('progress-status').innerText = '🛑 Đã dừng đợt cào theo yêu cầu!';
                document.getElementById('progress-bar').style.width = '0%';
                document.getElementById('progress-percent').innerText = '0%';

                const term = document.getElementById('terminal-log');
                term.scrollTop = term.scrollHeight;
            } catch (e) {
                console.error(e);
            }
        }


        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        const TOAST_ICONS = {
            success: `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--apple-green);flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
            error:   `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--apple-red);flex-shrink:0"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
            warn:    `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#ff9500;flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            info:    `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--apple-blue);flex-shrink:0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                ${TOAST_ICONS[type] || TOAST_ICONS.info}
                <div style="flex:1; line-height:1.5;">${message}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 30);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        }

        async function triggerAction(action) {
            if (action === 'reset' && !confirm('⚠️ Xóa trắng toàn bộ CSDL và file Excel cũ?')) return;
            if (action === 'huy' && !confirm('⚠️ Xác nhận hoàn tác đợt cào gần nhất?')) return;

            const res = await fetch(`/api/${action}`, { method: 'POST' });
            const data = await res.json();
            showToast(data.message || 'Đã thực hiện!', data.success ? 'success' : 'error');
            loadLeads();
        }

        loadLeads();
        setTimeout(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, 300);
    </script>
</body>
</html>
